name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Safe-Auto-Tool-Switcher-source-0.1.0.zip -d project

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: |
          PROJECT_DIR=$(dirname "$(find project -name build.gradle -print -quit)")
          gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Safe-Auto-Tool-Switcher
          path: project/**/build/libs/*.jar
